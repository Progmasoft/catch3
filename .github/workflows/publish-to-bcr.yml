# Opens the pull request that adds a release to the Bazel Central Registry as
# progmasoft_catch3, from the templates in .bcr/. The registry builds the test
# module of .bcr/presubmit.yml before it accepts the version.
name: Publish to BCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: The release tag, such as catch3-0.5.0
        required: true
        type: string

permissions: {}

jobs:
  publish:
    if: startsWith(github.event.release.tag_name || inputs.tag_name, 'catch3-')
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@3b1b972e41764b9a7498cf9128ed4ed2258a3687 # v1.6.0
    with:
      tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
      tag_prefix: catch3-
      registry_fork: Leitwolf11/bazel-central-registry
      # BCR accepts source attestations only from bazel-contrib's release
      # workflow; Catch3's releases are made without it.
      attest: false
    permissions:
      contents: write # the reusable workflow may add files to the release
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
