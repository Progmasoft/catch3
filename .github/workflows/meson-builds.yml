name: Meson Builds

on: [push, pull_request]

jobs:
  build:
    name: Meson on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Meson and Ninja
        run: python -m pip install meson ninja

      - name: Configure with Clang-CL on Windows
        if: runner.os == 'Windows'
        env:
          CC: clang-cl
          CXX: clang-cl
        run: meson setup build/meson --vsenv -Dtests=true -Dinstall=false

      - name: Configure with Apple Clang on macOS
        if: runner.os == 'macOS'
        env:
          CC: clang
          CXX: clang++
        run: meson setup build/meson -Dtests=true -Dinstall=false

      - name: Build
        run: meson compile -C build/meson

      - name: Test
        run: meson test -C build/meson --print-errorlogs
