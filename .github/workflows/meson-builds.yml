name: Meson Builds

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Meson on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install Meson and Ninja
        run: python -m pip install --requirement requirements-meson.txt

      - name: Configure with Clang-CL on Windows
        if: runner.os == 'Windows'
        env:
          CC: clang-cl
          CXX: clang-cl
        run: meson setup build/meson --vsenv -Dtests=true -Dinstall=false

      - name: Configure with Apple Clang on macOS
        if: runner.os == 'macOS'
        env:
          CC: clang
          CXX: clang++
        run: meson setup build/meson -Dtests=true -Dinstall=false

      - name: Build
        run: meson compile -C build/meson

      - name: Test
        run: meson test -C build/meson --print-errorlogs
