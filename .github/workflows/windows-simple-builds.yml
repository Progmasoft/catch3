name: Windows Builds (Basic)

on:
  push:
    branches: [devel]
  pull_request:

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CTEST_NO_TESTS_ACTION: error

jobs:
  build:
    name: ${{matrix.os}}, ${{matrix.std}}, ${{matrix.build_type}}, ${{matrix.platform}}
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026]
        platform: [Win32, x64]
        build_type: [Debug, Release]
        std: [17, 20]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install what the extra tests import
        run: python -m pip install --require-hashes --requirement requirements-tests.txt

      - name: Configure build
        run: |
          cmake --preset all-tests `
                -A ${{matrix.platform}} `
                -DCMAKE_CXX_STANDARD=${{matrix.std}} `
                -DPython3_EXECUTABLE="$((Get-Command python).Source)"

      - name: Build tests
        run: cmake --build build --config ${{matrix.build_type}} --parallel $env:NUMBER_OF_PROCESSORS
        shell: pwsh

      - name: Run tests
        run: ctest --test-dir build -C ${{matrix.build_type}} -j $env:NUMBER_OF_PROCESSORS
        shell: pwsh
