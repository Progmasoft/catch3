name: Check header guards

on:
  push:
    branches: [devel]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Set the type of machine to run on
    runs-on: ubuntu-26.04
    steps:

      - name: Checkout source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # Pushes to the default branch write to the Progmasoft remote cache and
      # pull requests only read it; a pull request from a fork gets no secrets
      # and builds without it.
      - name: Use the Progmasoft remote cache
        shell: bash
        env:
          WRITES: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
          CACHE_READ: ${{ secrets.BAZEL_CACHE_READ }}
          CACHE_WRITE: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && secrets.BAZEL_CACHE_WRITE || '' }}
        run: |
          auth=$([ "$WRITES" = true ] && echo "$CACHE_WRITE" || echo "$CACHE_READ")
          if [ -z "$auth" ]; then
            echo "No cache credentials: building without the remote cache."
            exit 0
          fi
          {
            echo "common --remote_cache=https://remotecache.progmasoft.com"
            echo "common --remote_header=\"Authorization=Basic $auth\""
            [ "$WRITES" = true ] || echo "common --remote_upload_local_results=false"
          } >> "$HOME/.bazelrc"

      - name: Test the tools
        run: bazel test //tools:tools_tests
        env:
          CC: clang

      - name: Check licenses, headers, file names, versions and the amalgamation
        run: bazel run //tools:check
        env:
          CC: clang

      # third_party/ must be the pinned release archives, byte for byte.
      - name: Check that third_party matches its pinned archives
        run: bazel run //tools:third_party -- --check
        env:
          CC: clang
