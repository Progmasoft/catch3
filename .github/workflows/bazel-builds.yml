name: Bazel Builds

on:
  push:
    branches: [devel]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Bazel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-26.04]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # Pushes to the default branch write to the Progmasoft remote cache and
      # pull requests only read it; a pull request from a fork gets no secrets
      # and builds without it.
      - name: Use the Progmasoft remote cache
        shell: bash
        env:
          WRITES: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
          CACHE_READ: ${{ secrets.BAZEL_CACHE_READ }}
          CACHE_WRITE: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && secrets.BAZEL_CACHE_WRITE || '' }}
        run: |
          auth=$([ "$WRITES" = true ] && echo "$CACHE_WRITE" || echo "$CACHE_READ")
          if [ -z "$auth" ]; then
            echo "No cache credentials: building without the remote cache."
            exit 0
          fi
          {
            echo "common --remote_cache=https://remotecache.progmasoft.com"
            echo "common --remote_header=\"Authorization=Basic $auth\""
            [ "$WRITES" = true ] || echo "common --remote_upload_local_results=false"
          } >> "$HOME/.bazelrc"

      - name: Run Progmasoft property tests on Windows
        if: runner.os == 'Windows'
        run: bazel test tests/Progmasoft:property_tests
        shell: bash
        env:
          BAZEL_SH: C:\Program Files\Git\bin\bash.exe

      - name: Run Progmasoft property tests on Linux
        if: runner.os == 'Linux'
        run: bazel test tests/Progmasoft:property_tests
        env:
          CC: clang

  module:
    name: Bazel ${{ matrix.bazel }} module on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-26.04]
        # bazel_compatibility in MODULE.bazel is >=8.0.0; the Bazel Central
        # Registry runs the same test module on both lines.
        bazel: [8.x, 9.x]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # Pushes to the default branch write to the Progmasoft remote cache and
      # pull requests only read it; a pull request from a fork gets no secrets
      # and builds without it.
      - name: Use the Progmasoft remote cache
        shell: bash
        env:
          WRITES: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
          CACHE_READ: ${{ secrets.BAZEL_CACHE_READ }}
          CACHE_WRITE: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && secrets.BAZEL_CACHE_WRITE || '' }}
        run: |
          auth=$([ "$WRITES" = true ] && echo "$CACHE_WRITE" || echo "$CACHE_READ")
          if [ -z "$auth" ]; then
            echo "No cache credentials: building without the remote cache."
            exit 0
          fi
          {
            echo "common --remote_cache=https://remotecache.progmasoft.com"
            echo "common --remote_header=\"Authorization=Basic $auth\""
            [ "$WRITES" = true ] || echo "common --remote_upload_local_results=false"
          } >> "$HOME/.bazelrc"

      - name: Test the module as a user's module depends on it
        working-directory: tests/Progmasoft/BazelModule
        run: bazel test //...
        shell: bash
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
          BAZEL_SH: ${{ runner.os == 'Windows' && 'C:\Program Files\Git\bin\bash.exe' || '' }}
