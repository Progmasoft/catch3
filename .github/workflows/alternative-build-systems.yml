name: Alternative Build Systems

on:
  push:
    branches: [devel]
  pull_request:

permissions:
  contents: read

jobs:
  xmake:
    name: Xmake on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-26.04]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: '3.1.1'

      # The STL of this Visual Studio needs Clang 22 or newer, which the image does not have: LLVM 23.1.5 from its MSI,
      # checked against the SHA-256 of its release and unpacked by an administrative install, comes first on PATH,
      # and CLANG_CL names its clang-cl.
      - name: Restore LLVM
        if: runner.os == 'Windows'
        id: llvm
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-23.1.5-win64-msi

      - name: Install LLVM
        if: runner.os == 'Windows' && steps.llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "llvm.msi"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/LLVM-23.1.5-win64.msi" -OutFile $msi
          $sha = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
          if ($sha -ne "288ab326377157a9e02e6fb9724914cc2b55963882d493a405f31dc66e837c12") { throw "LLVM has the SHA-256 $sha" }
          $llvm = Join-Path $env:RUNNER_TEMP "llvm"
          $process = Start-Process msiexec.exe -ArgumentList "/a", "`"$msi`"", "/qn", "TARGETDIR=`"$llvm`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "msiexec failed with $($process.ExitCode)" }

      - name: Put LLVM first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "llvm") -Recurse -Filter clang-cl.exe | Select-Object -First 1
          if ($null -eq $clang) { throw "the LLVM install has no clang-cl.exe" }
          "PATH=$($clang.DirectoryName);${env:PATH}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_CL=$($clang.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure Clang build
        run: xmake f --toolchain=${{ runner.os == 'Windows' && 'clang-cl' || 'clang' }} -m debug -y

      - name: Build
        run: xmake -j 4

      - name: Run property tests
        run: xmake run ProgmasoftPropertyTests

  premake:
    name: Premake on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-26.04]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: abel0b/setup-premake@b80dc6f70e8ab159fb854bdadbeb1a53cfc28723 # v2.4
        with:
          version: '5.0.0-beta7'

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        if: runner.os == 'Windows'
        with:
          msbuild-architecture: x64

      - name: Generate and build Visual Studio projects
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          premake5 vs2022
          msbuild build/premake/Catch3.sln /m /p:Configuration=Debug /p:Platform=x64 /nologo

      - name: Run property tests on Windows
        if: runner.os == 'Windows'
        run: build/premake/bin/Debug/ProgmasoftPropertyTests.exe

      - name: Generate and build Clang Makefiles
        if: runner.os == 'Linux'
        run: |
          premake5 gmake --cc=clang
          make -C build/premake config=debug -j 4

      - name: Run property tests on Linux
        if: runner.os == 'Linux'
        run: build/premake/bin/Debug/ProgmasoftPropertyTests
